# =============================================================================
#  zsh/starship.toml — managed by dotfiles
#  https://starship.rs/config/
# =============================================================================

"$schema" = 'https://starship.rs/config-schema.json'

format = """
$username\
$hostname\
$directory\
$git_branch\
$git_status\
$git_state\
$fill\
$nodejs\
$python\
$php\
$golang\
$dotnet\
$java\
$swift\
$rust\
$cmd_duration\
$line_break\
$character"""

palette = "catppuccin_mocha"

[palettes.catppuccin_mocha]
rosewater = "#f5e0dc"
flamingo  = "#f2cdcd"
pink      = "#f5c2e7"
mauve     = "#cba6f7"
red       = "#f38ba8"
maroon    = "#eba0ac"
peach     = "#fab387"
yellow    = "#f9e2af"
green     = "#a6e3a1"
teal      = "#94e2d5"
sky       = "#89dceb"
sapphire  = "#74c7ec"
blue      = "#89b4fa"
lavender  = "#b4befe"
text      = "#cdd6f4"
subtext1  = "#bac2de"
subtext0  = "#a6adc8"
overlay2  = "#9399b2"
overlay1  = "#7f849c"
overlay0  = "#6c7086"
surface2  = "#585b70"
surface1  = "#45475a"
surface0  = "#313244"
base      = "#1e1e2e"
mantle    = "#181825"
crust     = "#11111b"

[fill]
symbol = " "

[character]
success_symbol = "[❯](bold green)"
error_symbol   = "[❯](bold red)"
vimcmd_symbol  = "[❮](bold green)"

[directory]
style            = "bold blue"
truncation_length = 4
truncate_to_repo = true
read_only        = " 󰌾"
home_symbol      = "~"

[git_branch]
format = "[$symbol$branch(:$remote_branch)]($style) "
symbol = " "
style  = "bold mauve"

[git_status]
format    = "([\\[$all_status$ahead_behind\\]]($style) )"
style     = "bold red"
ahead     = "⇡${count}"
behind    = "⇣${count}"
diverged  = "⇕⇡${ahead_count}⇣${behind_count}"
untracked = "?"
stashed   = "$"
modified  = "!"
staged    = "+"
renamed   = "»"
deleted   = "✘"

[git_state]
format = "\\([$state( $progress_current/$progress_total)]($style)\\) "
style  = "bold yellow"

[nodejs]
symbol = " "
style  = "bold green"
format = "[$symbol($version )]($style)"
detect_files = ["package.json", ".node-version", ".nvmrc"]

[python]
symbol = " "
style  = "bold yellow"
format = "[$symbol$pyenv_prefix($version )(\\($virtualenv\\) )]($style)"

[php]
symbol = " "
style  = "bold blue"
format = "[$symbol($version )]($style)"

[golang]
symbol = " "
style  = "bold sky"
format = "[$symbol($version )]($style)"

[dotnet]
symbol = "󰪮 "
style  = "bold mauve"
format = "[$symbol($version )(🎯 $tfm )]($style)"

[java]
symbol = " "
style  = "bold red"
format = "[$symbol($version )]($style)"

[swift]
symbol = " "
style  = "bold peach"
format = "[$symbol($version )]($style)"

[rust]
symbol = " "
style  = "bold peach"
format = "[$symbol($version )]($style)"

[cmd_duration]
min_time          = 2000
format            = "[$duration]($style) "
style             = "bold yellow"
show_notifications = false

[hostname]
ssh_only = true
format   = "[$hostname]($style) in "
style    = "bold green"

[username]
show_always = false
format      = "[$user]($style)@"
style_user  = "bold green"
style_root  = "bold red"
